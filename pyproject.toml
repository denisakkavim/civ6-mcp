[project]
name = "civ6-mcp"
version = "1.1.11"
description = "MCP server for Civilization VI — lets LLM agents read game state and play"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Liam Wilkinson", email = "liam.m.wilkinson@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["civ6", "civilization", "mcp", "llm", "agent", "game-ai", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.20",
]

[project.optional-dependencies]
launcher-macos = [
    "pyobjc-framework-Quartz>=11.0",
    "pyobjc-framework-Vision>=11.0",
]
launcher-windows = [
    "winrt-Windows.Media.Ocr>=2.1",
    "winrt-Windows.Graphics.Imaging>=2.1",
    "winrt-Windows.Storage.Streams>=2.1",
    "winrt-Windows.Foundation>=2.1",
    "winrt-Windows.Foundation.Collections>=2.1",
]
launcher-linux = [
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
launcher = ["civ6-mcp[launcher-macos]"]  # backward compat alias

[project.urls]
Homepage = "https://github.com/lmwilki/civ6-mcp"
Repository = "https://github.com/lmwilki/civ6-mcp"

[project.scripts]
civ-mcp = "civ_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civ_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # scripts/ CLIs
    "typer>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets test modules do `from support import recordings` from any subfolder.
pythonpath = ["tests"]
# `live` needs a running Civ 6 with FireTuner. CI runs `-m "not live"`; run
# `uv run pytest -m live` locally with a game up.
markers = [
    "live: requires a running Civ 6 with FireTuner",
    "destructive: kills/relaunches the game; run on its own",
]
# xfail(strict=True) marks refactor stages that have not landed yet: when the
# work lands the test XPASSes and the suite goes red, which is the prompt to
# delete the marker. See tests/README.md.
xfail_strict = true
